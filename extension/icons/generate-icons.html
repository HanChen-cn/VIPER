<!DOCTYPE html>
<html>
<head><title>生成图标</title></head>
<body>
<h2>点击下方按钮下载图标，或自动下载</h2>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<br><br>
<a id="dl16" download="icon16.png">下载 16x16</a> |
<a id="dl48" download="icon48.png">下载 48x48</a> |
<a id="dl128" download="icon128.png">下载 128x128</a>
<script>
function drawIcon(canvas, size) {
  var ctx = canvas.getContext('2d');
  var radius = size * 0.2;

  // 渐变背景
  var grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#667eea');
  grad.addColorStop(1, '#764ba2');

  // 圆角矩形
  ctx.beginPath();
  ctx.moveTo(radius, 0);
  ctx.lineTo(size - radius, 0);
  ctx.quadraticCurveTo(size, 0, size, radius);
  ctx.lineTo(size, size - radius);
  ctx.quadraticCurveTo(size, size, size - radius, size);
  ctx.lineTo(radius, size);
  ctx.quadraticCurveTo(0, size, 0, size - radius);
  ctx.lineTo(0, radius);
  ctx.quadraticCurveTo(0, 0, radius, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 数字 6
  ctx.fillStyle = 'white';
  ctx.font = 'bold ' + Math.round(size * 0.65) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('6', size / 2, size / 2 + size * 0.03);
}

var sizes = [16, 48, 128];
sizes.forEach(function(size) {
  var canvas = document.getElementById('c' + size);
  drawIcon(canvas, size);
  var link = document.getElementById('dl' + size);
  link.href = canvas.toDataURL('image/png');
});

// 自动下载
setTimeout(function() {
  sizes.forEach(function(size) {
    var link = document.getElementById('dl' + size);
    link.click();
  });
}, 500);
</script>
</body>
</html>
