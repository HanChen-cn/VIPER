name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package extension
        run: cd extension && zip -r ../VIPER-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VIPER ${{ steps.version.outputs.VERSION }}
          files: VIPER-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
